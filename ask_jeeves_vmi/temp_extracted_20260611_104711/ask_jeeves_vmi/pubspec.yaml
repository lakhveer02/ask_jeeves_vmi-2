name: ask_jeeves_vmi
description: "Ask-Jeeves Vault - Enterprise-Grade VMI AI Platform with Zero-Trust Security"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.2.7

  # UI & Animations
  flutter_animate: ^4.5.0
  
  # Networking & API
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^1.4.1
  
  # Security & Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  
  # Face Recognition & Media
  google_mlkit_face_detection: ^0.10.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  
  # Location & Geofencing
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  
  # Network Connectivity
  connectivity_plus: ^6.0.5
  
  # Device Info & Security
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  
  # Utils
  uuid: ^4.5.1
  logger: ^2.4.0
  freezed_annotation: ^2.4.4
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Speech Recognition
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  
  # Testing
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/animations/
